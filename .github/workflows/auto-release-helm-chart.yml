name: Release Helm Charts

on:
  push:
    branches:
      - master
      - release-*
    paths:
      - "charts/**"

  workflow_dispatch: # Use for manaully trigger to debug

permissions:
  contents: read
  packages: write

jobs:
  release-helm-chart:
    runs-on: ubuntu-latest
    steps:
      # This step uses Github's checkout-action: https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          fetch-depth: 0

      # Configure Git for helm release
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # Install Helm
      - name: Install Helm
        uses: azure/setup-helm@7a9c28ba04c99ae42726a8472c6eba25beab7bee # tag=v5.0.1
        with:
          version: v3.4.0

      # Run chart-releaser action (https://github.com/helm/chart-releaser-action)
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # tag=v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NAME_TEMPLATE: "{{ .Name }}-chart-{{ .Version }}"
